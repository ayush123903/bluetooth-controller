    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
        }

        button {
            padding: 15px 25px;
            margin: 8px;
            font-size: 18px;

        }

        input {
            width: 250px;

    </style>
</head>

<body>

    <h1>DIY Bluetooth Controller</h1>

    <p>Control your DIY project using Bluetooth</p>

    <button>🔵 Connect Bluetooth</button>

    <div>
        <button>⬆️ Forward</button>
    </div>

    <div>
        <button>⬅️ Left</button>
        <button>⏹️ Stop</button>
        <button>➡️ Right</button>
    </div>

    <div>
        <button>⬇️ Backward</button>
    </div>

    <input type="range" min="0" max="100" value="50">

    <p>Speed: 50%</p>

</body>
